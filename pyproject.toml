[project]
name = "gtb"
version = "0.1.0"
description = "Forward test of the gold Tokyo-range breakout on Pepperstone cTrader"
readme = "README.md"
authors = [
    { name = "Ivan Osipchyk", email = "ivan.osipchyk.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.111",
    "ctrader-open-api>=0.9.2",
    "httpx>=0.28.1",
    "protobuf>=3.20.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["gtb"]
