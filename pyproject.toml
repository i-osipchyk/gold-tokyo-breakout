[project]
name = "gtb"
version = "0.1.0"
description = "Forward test of the gold Tokyo-range breakout on Pepperstone cTrader"
readme = "README.md"
authors = [
    { name = "Ivan Osipchyk", email = "ivan.osipchyk.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.111",
    "ctrader-open-api>=0.9.2",
    "httpx>=0.28.1",
    "protobuf>=3.20.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 30
filterwarnings = [
    # importing ctrader_open_api.messages runs the package __init__, which loads Twisted;
    # the client doesn't use Twisted's TLS, so its service_identity warning doesn't apply
    "ignore:You do not have a working installation of the service_identity module",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:google.protobuf",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["fake_ctrader", "fake_broker", "synthetic"]

[tool.mypy]
strict = true
packages = ["gtb"]

[[tool.mypy.overrides]]
module = ["ctrader_open_api.*", "yaml", "boto3", "botocore.*"]
ignore_missing_imports = true
